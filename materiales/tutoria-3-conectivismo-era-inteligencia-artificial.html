<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tutoría 3 · Conectivismo en la era de la inteligencia artificial</title>
<!-- METADATOS DE LA BIBLIOTECA DIGITAL -->
<meta name="jc-titulo" content="Tutoría 3 · Conectivismo en la era de la inteligencia artificial">
<meta name="jc-descripcion" content="Presentación interactiva sobre el conectivismo como problema psicológico en la era de la inteligencia artificial, con énfasis en conocimiento distribuido, memoria híbrida, juicio epistemológico, metacognición, redes humano-tecnología, cognición distribuida y mente extendida.">
<meta name="jc-tipo" content="Presentación interactiva de clase">
<meta name="jc-etiquetas" content="Conectivismo, George Siemens, Inteligencia artificial, IA generativa, Psicología, Aprendizaje, Teorías del aprendizaje, Conocimiento distribuido, Redes de aprendizaje, Aprendizaje informal, Memoria, Memoria híbrida, Metacognición, Autorregulación del aprendizaje, Juicio epistemológico, Cognición epistémica, Vigilancia epistémica, Criterios de evaluación, Alfabetización informacional, Pensamiento crítico, Cognición distribuida, Mente extendida, Sistemas humano-IA, Agencia cognitiva, Autonomía epistemológica, Navegación de redes, Calidad de conexiones, Google, Buscadores académicos, Toma de decisiones, Sesgos cognitivos, Calibración de confianza, Aprendizaje en red, Psicología cognitiva">
<meta name="jc-curso" content="Herramientas Digitales para las Ciencias Sociales">
<meta name="jc-autor" content="Juan Carlos Valderrama Cárdenas">

<style>
  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --accent:#1f5c5b;
    --accent-2:#2b7a78;
    --accent-soft:#e9f1f0;
    --ink:#17201f;
    --muted:#66716f;
    --bg:#f6f6f3;
    --panel:#ffffff;
    --line:#e2e4df;
    --danger-soft:#f7efec;
    --danger:#a95b47;
    --warm-soft:#f7f1e6;
    --warm:#a97b3c;
    --sidebar-w:322px;
    --radius:12px;
  }

  html,body{height:100%}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:19px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  button{font-family:inherit}

  .app{display:flex;height:100vh;height:100dvh;overflow:hidden}

  /* ============ SIDEBAR ============ */
  .sidebar{
    flex:0 0 var(--sidebar-w);width:var(--sidebar-w);
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;z-index:60;
    transition:margin-left .32s ease,opacity .26s ease;
  }
  .sidebar__head{padding:24px 22px 16px;border-bottom:1px solid var(--line)}
  .sidebar__kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .sidebar__title{font-size:15.5px;font-weight:650;line-height:1.3;margin-top:8px;letter-spacing:-.01em}
  .sidebar__nav{flex:1;overflow-y:auto;padding:14px 12px 30px;scrollbar-width:thin}
  .sidebar__nav::-webkit-scrollbar{width:8px}
  .sidebar__nav::-webkit-scrollbar-thumb{background:#d9dcd6;border-radius:8px}

  .idx-home{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:10px 12px;border:none;background:transparent;text-align:left;
    border-radius:9px;color:var(--ink);font-size:15px;font-weight:600;
    cursor:pointer;margin-bottom:4px;transition:background .15s,color .15s;
  }
  .idx-home:hover{background:#f1f3ef}
  .idx-home.is-active{background:var(--accent-soft);color:var(--accent)}

  .idx-section{
    display:block;width:100%;text-align:left;
    padding:16px 12px 6px;border:none;background:transparent;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:700;color:var(--muted);cursor:pointer;transition:color .15s;
  }
  .idx-section:hover{color:var(--accent)}
  .idx-section.is-active{color:var(--accent)}

  .idx-link{
    display:block;width:100%;text-align:left;
    padding:6px 12px;border:none;background:transparent;
    border-left:2px solid transparent;border-radius:0 8px 8px 0;
    color:#3d4745;font-size:14px;line-height:1.36;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .idx-link:hover{background:#f1f3ef;color:var(--ink)}
  .idx-link.is-active{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:600}

  @media (min-width:981px){
    .app--collapsed .sidebar{margin-left:calc(-1 * var(--sidebar-w));opacity:0;pointer-events:none}
  }

  /* ============ STAGE ============ */
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .progress{height:3px;background:var(--line);flex:0 0 3px;position:relative}
  .progress__bar{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width .35s ease}
  .slides{flex:1;position:relative;overflow:hidden}

  .slide{
    position:absolute;inset:0;overflow-y:auto;display:flex;
    padding:clamp(30px,5.2vw,82px) clamp(22px,5.6vw,96px);
    opacity:0;visibility:hidden;transform:translateY(12px);
    transition:opacity .34s ease,transform .34s ease,visibility .34s;
    scrollbar-width:thin;
  }
  .slide::-webkit-scrollbar{width:8px}
  .slide::-webkit-scrollbar-thumb{background:#d9dcd6;border-radius:8px}
  .slide.is-active{opacity:1;visibility:visible;transform:none}
  .slide__inner{margin:auto;width:100%;max-width:1120px}

  /* ============ ANIMATIONS ============ */
  @keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,92,91,.28)}50%{box-shadow:0 0 0 8px rgba(31,92,91,0)}}

  .slide.is-active .slide__inner > *{animation:riseIn .55s cubic-bezier(.22,.68,.28,1) both}
  .slide.is-active .slide__inner > *:nth-child(1){animation-delay:.04s}
  .slide.is-active .slide__inner > *:nth-child(2){animation-delay:.10s}
  .slide.is-active .slide__inner > *:nth-child(3){animation-delay:.16s}
  .slide.is-active .slide__inner > *:nth-child(4){animation-delay:.22s}
  .slide.is-active .slide__inner > *:nth-child(5){animation-delay:.28s}

  .slide.is-active .card,
  .slide.is-active .step,
  .slide.is-active .flow__item,
  .slide.is-active ul.clean li,
  .slide.is-active ol.num li,
  .slide.is-active .chip,
  .slide.is-active .table-wrap,
  .slide.is-active .callout,
  .slide.is-active .eq,
  .slide.is-active .chart__row,
  .slide.is-active .pipe-node,
  .slide.is-active .v-three__item,
  .slide.is-active .v-grid__item,
  .slide.is-active .v-group,
  .slide.is-active .sim,
  .slide.is-active .bignum,
  .slide.is-active .ladder__step,
  .slide.is-active .quote-big,
  .slide.is-active .everyday,
  .slide.is-active .stu-card,
  .slide.is-active .node-pill{animation:riseIn .5s cubic-bezier(.22,.68,.28,1) both}

  .slide.is-active .sec-num{animation:popIn .6s cubic-bezier(.22,.68,.28,1) both}
  .card{transition:border-color .2s ease,transform .2s ease}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}

  /* ============ TYPOGRAPHY ============ */
  .kicker{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
  .slide h2{font-size:clamp(28px,3.3vw,40px);line-height:1.15;letter-spacing:-.018em;font-weight:700;margin-bottom:20px;max-width:28ch}
  .slide h3{font-size:16.5px;letter-spacing:.02em;margin-bottom:10px;color:var(--accent);font-weight:700}
  .slide p{font-size:clamp(18px,1.42vw,20.5px);color:#26302e;margin-bottom:14px;max-width:76ch}
  .slide p.lead{font-size:clamp(19.5px,1.75vw,23px);color:var(--ink);line-height:1.5}
  .muted-note{color:var(--muted);font-size:16.5px !important;line-height:1.5;border-top:1px solid var(--line);padding-top:13px;margin-top:18px;max-width:82ch}
  strong{font-weight:650}

  /* ============ LISTS ============ */
  ul.clean,ol.num{list-style:none;margin:6px 0 16px;display:grid;gap:9px}
  ul.clean li,ol.num li{position:relative;padding-left:26px;font-size:17.5px;line-height:1.48;color:#26302e}
  ul.clean li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  ol.num{counter-reset:n}
  ol.num li{counter-increment:n;padding-left:40px}
  ol.num li::before{content:counter(n);position:absolute;left:0;top:.02em;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:grid;place-items:center}
  ul.clean.two-col{grid-template-columns:1fr 1fr;column-gap:36px}
  ul.clean.compact li{font-size:16px}
  ul.clean.compact{gap:6px}

  /* ============ CARDS ============ */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:10px 0 16px}
  .cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:10px 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .card h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:700}
  .card p{font-size:16.5px;margin-bottom:0;line-height:1.5;max-width:none}
  .card ul{margin:0}
  .card--accent{border-color:var(--accent);background:var(--accent-soft)}
  .card--warm{border-color:var(--warm);background:var(--warm-soft)}

  /* ============ EVERYDAY EXAMPLE ============ */
  .everyday{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--warm-soft);border-left:3px solid var(--warm);
    border-radius:0 10px 10px 0;padding:13px 18px;margin:12px 0 16px;
    font-size:16.5px;line-height:1.5;color:#5a4527;max-width:84ch;
  }
  .everyday::before{
    content:"Ejemplo cotidiano";flex:0 0 auto;
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    font-weight:700;color:var(--warm);background:#fff;
    border:1px solid var(--warm);border-radius:999px;padding:3px 9px;
    margin-top:1px;
  }

  /* ============ CALLOUTS ============ */
  .callout{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 18px;font-size:17px;line-height:1.5;margin:10px 0 16px;color:#1f3b39;max-width:82ch}
  .callout em{font-style:italic}
  .callout--no{background:var(--danger-soft);border-left-color:var(--danger);color:#6d3a2c}

  .quote-big{background:var(--accent);color:#fff;border-radius:var(--radius);padding:22px 26px;font-size:clamp(18px,1.7vw,22px);line-height:1.45;max-width:62ch;margin:14px 0 18px}

  /* ============ CODE ============ */
  .eq{background:#f0f2ee;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;white-space:pre-wrap;margin:8px 0 16px;color:#243230;max-width:80ch}

  /* ============ TABLES ============ */
  .table-wrap{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:var(--radius)}
  .table{width:100%;border-collapse:collapse;font-size:15px;min-width:720px;background:var(--panel)}
  .table th{text-align:left;padding:11px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);font-weight:700;vertical-align:bottom;background:#fafbf8}
  .table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.42}
  .table tr:last-child td{border-bottom:none}
  .table td strong{color:var(--accent)}

  /* ============ CHIPS ============ */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14.5px;color:#33403e}

  /* ============ STEPS ============ */
  .steps{display:grid;gap:0;margin:8px 0 16px;counter-reset:s;max-width:86ch}
  .step{position:relative;padding:12px 0 12px 50px;border-bottom:1px solid var(--line);font-size:17.5px;line-height:1.44}
  .step:last-child{border-bottom:none}
  .step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:12px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}

  /* ============ COVER ============ */
  .cover .rule{width:60px;height:3px;background:var(--accent);margin-bottom:26px}
  .cover h1{font-size:clamp(32px,4.5vw,58px);line-height:1.07;letter-spacing:-.027em;font-weight:800;max-width:22ch;margin-bottom:20px}
  .cover .lead{color:var(--muted);font-size:clamp(18.5px,1.65vw,22px);max-width:56ch}
  .cover .cover-name{margin-top:24px;font-size:clamp(18.5px,1.55vw,21px);font-weight:650;color:var(--ink)}
  .cover .cover-role{font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:4px}
  .cover .hint{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px;max-width:56ch}

  /* ============ SECTION ============ */
  .slide--section{background:var(--accent);color:#fff}
  .slide--section .sec-num{font-size:clamp(60px,11vw,136px);font-weight:800;line-height:.88;letter-spacing:-.04em;color:rgba(255,255,255,.26);margin-bottom:10px}
  .slide--section h2{color:#fff;font-size:clamp(30px,4.5vw,50px);max-width:none;margin-bottom:14px}
  .slide--section .sec-sub{color:rgba(255,255,255,.86);font-size:clamp(17px,1.6vw,20px);max-width:64ch}

  /* ============ CHART ============ */
  .chart{display:grid;gap:10px;margin:16px 0 18px;max-width:820px}
  .chart__row{display:grid;grid-template-columns:minmax(150px,240px) 1fr 46px;gap:12px;align-items:center;font-size:15.5px}
  .chart__label{color:#33403e;line-height:1.28}
  .chart__track{height:14px;background:#eceee9;border-radius:999px;overflow:hidden}
  .chart__fill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .85s cubic-bezier(.22,.68,.28,1)}
  .slide.is-active .chart__fill{width:var(--w)}
  .chart__value{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14.5px}

  /* ============ SVG ============ */
  .svg-figure{width:100%;max-width:940px;margin:12px 0 16px;display:block}
  .svg-figure text{font-family:inherit}
  .pipe-node{transform-origin:center}

  /* ============ VISUAL COMPONENTS ============ */
  .v-three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 18px}
  .v-three__item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px}
  .v-three__item--accent{background:var(--accent-soft);border-color:var(--accent)}
  .v-three__num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;margin-bottom:10px}
  .v-three__item h4{font-size:15.5px;color:var(--ink);margin-bottom:6px}
  .v-three__item p{font-size:15px;color:#33403e;line-height:1.44;margin:0}

  .v-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 16px}
  .v-grid__item{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:15px;line-height:1.38}
  .v-grid__item span{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;margin-top:1px}

  .v-groups{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0 16px}
  .v-group{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--panel)}
  .v-group--accent{background:var(--accent-soft);border-color:var(--accent)}
  .v-group h4{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;font-weight:700}
  .v-group .chips{margin:0}

  .bignums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 18px}
  .bignum{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px}
  .bignum strong{display:block;font-size:clamp(26px,3vw,38px);line-height:1;color:var(--accent);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .bignum span{font-size:14px;color:#4a5452;line-height:1.35;display:block}

  .ladder{display:grid;gap:6px;margin:14px 0 18px;max-width:760px}
  .ladder__step{display:flex;gap:12px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 15px;font-size:16px}
  .ladder__step b{color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase;flex:0 0 100px}
  .ladder__step--accent{background:var(--accent-soft);border-color:var(--accent)}

  /* ============ SIMULACIONES ============ */
  .sim{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px 18px;margin:14px 0 18px;max-width:960px}
  .sim__head{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .sim__head::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2.4s infinite}
  .sim__modes{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .sim__btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 15px;font-size:14px;color:#33403e;cursor:pointer;transition:all .15s}
  .sim__btn:hover{border-color:var(--accent);color:var(--accent)}
  .sim__btn.is-on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .sim__btn--primary{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
  .sim__stage{background:#fafbf8;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;min-height:120px;display:flex;flex-direction:column;gap:10px;justify-content:center}
  .sim__out{font-size:15.5px;color:#33403e;line-height:1.5;margin:0;border-left:2px solid var(--accent-soft);padding-left:12px}

  /* red */
  .net-wrap{position:relative;width:100%;max-width:640px;margin:0 auto;aspect-ratio:640/380}
  .net-svg{position:absolute;inset:0;width:100%;height:100%}
  .net-node{
    position:absolute;transform:translate(-50%,-50%);
    border:1.5px solid var(--accent);background:var(--panel);
    border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;
    color:var(--accent);cursor:pointer;white-space:nowrap;
    transition:all .18s;z-index:2;
  }
  .net-node:hover{background:var(--accent-soft)}
  .net-node.is-on{background:var(--accent);color:#fff}

  /* tres estudiantes */
  .stu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
  .stu-card{
    border:1.5px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;background:var(--panel);cursor:pointer;
    transition:all .18s;
  }
  .stu-card:hover{border-color:var(--accent)}
  .stu-card.is-on{border-color:var(--accent);background:var(--accent-soft)}
  .stu-card h5{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:700}
  .stu-card p{font-size:14.5px;line-height:1.42;margin:0;color:#33403e}

  /* matriz */
  .dec-grid{display:grid;gap:8px;margin-bottom:12px}
  .dec-item{
    display:flex;gap:12px;align-items:flex-start;
    background:#fafbf8;border:1px solid var(--line);
    border-radius:9px;padding:10px 14px;font-size:15px;line-height:1.42;
    cursor:pointer;transition:background .15s;
  }
  .dec-item:hover{background:var(--accent-soft)}
  .dec-item.is-on{background:var(--accent-soft);border-color:var(--accent)}
  .dec-badge{
    flex:0 0 auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:700;border-radius:6px;padding:3px 8px;margin-top:1px;
  }
  .dec-badge--si{background:var(--accent);color:#fff}
  .dec-badge--cuidado{background:var(--warm-soft);color:var(--warm);border:1px solid var(--warm)}
  .dec-badge--no{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}

  /* memoria */
  .mem-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mem-col{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
  .mem-col h6{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:700}

    <p class="lead">La referencia fundamental es George Siemens y su texto <em>Connectivism: A Learning Theory for the Digital Age</em>.</p>
    <p>Su punto de partida es que conductismo, cognitivismo y constructivismo se desarrollaron antes de que la tecnología adquiriera el papel contemporáneo en la manera de acceder, producir y transformar conocimiento.</p>
    <p>Siemens concede especial importancia al <strong>aprendizaje informal</strong>, las <strong>redes personales</strong> y la necesidad de <strong>aprender continuamente</strong> en contextos de información cambiante.</p>
  `
},

{

  title:'La idea central',
  body:`

        <p>La unidad fundamental no es solo <em>individuo → conocimiento</em>.</p>

      <div class="card card--accent">
        <h4>Aprender = formar + mantener + recorrer + evaluar conexiones</h4>

      </div>
    </div>
    <p class="muted-note">El conocimiento puede estar distribuido a través de una red, mientras que aprender implica desarrollar y navegar esas conexiones.</p>

{
  type:'content', section:'03 · La distinción clave', nav:'A vs B',
  title:'A vs B',
  body:`
    <div class="cols">
      <div class="card">
        <h4>A. “Aprendemos de otras personas”</h4>
        <p>Esto no es novedoso. Prácticamente cualquier teoría sociocultural podría aceptarlo.</p>
      </div>
      <div class="card card--accent">
        <h4>B. “Una parte funcional del conocimiento puede encontrarse fuera del individuo”</h4>
        <p>Esta segunda afirmación es mucho más interesante.</p>
      </div>
    </div>
    <p class="muted-note">Aquí empieza el verdadero interés psicológico del conectivismo.</p>

{
  type:'content', section:'03 · La distinción clave', nav:'Ejemplo: análisis estadístico',
  title:'Ejemplo: análisis estadístico',
  body:`
    <p>Supongamos que necesito realizar un análisis estadístico. Puedo disponer de una red formada por:</p>
    <div class="chips">
      <span class="chip">conocimientos estadísticos propios</span>
      <span class="chip">un manual</span>
      <span class="chip">artículos científicos</span>
      <span class="chip">un colega</span>
      <span class="chip">bases de datos</span>
      <span class="chip">software estadístico</span>
      <span class="chip">documentación técnica</span>
      <span class="chip">un modelo de IA</span>
    </div>
    <p>La competencia no consiste necesariamente en memorizar todo lo que contienen esos nodos. Consiste también en:</p>
    <ul class="clean">
      <li>saber qué nodo utilizar;</li>
      <li>cuándo recurrir a él;</li>
      <li>cómo interactuar con él;</li>
      <li>cómo evaluar aquello que devuelve.</li>
    </ul>
  `
},

{

        <p>¿Sabes cocinar un plato porque te sabes la receta de memoria, o porque sabes dónde buscarla, reconocer una buena receta y adaptarla?</p>
      </div>
      <div class="v-three__item v-three__item--accent">
        <span class="v-three__num">B</span>
        <h4>Llegar a un lugar</h4>
        <p>¿Sabes llegar porque memorizaste la ruta, o porque sabes usar un mapa, orientarte y corregir cuando te desvías?</p>
      </div>
      <div class="v-three__item">
        <span class="v-three__num">C</span>
        <h4>Hablar otro idioma</h4>
        <p>¿Sabes inglés porque lo hablas sin apoyo, o porque sabes usar un traductor, evaluar si la traducción suena bien y corregirla?</p>
      </div>
    </div>
    <div class="everyday">En los tres casos la competencia no está solo “dentro”, pero tampoco está solo “fuera”: depende de la organización entre lo que la persona sabe y los recursos que sabe movilizar.</div>

        <line x1="680" y1="130" x2="780" y2="175" stroke="#1f5c5b" stroke-width="1.4" marker-end="url(#a2)"/>
        <text x="580" y="86" text-anchor="middle" font-size="11.5" fill="#17201f">conexiones</text>
        <text x="780" y="86" text-anchor="middle" font-size="11.5" fill="#17201f">red</text>
        <text x="580" y="190" text-anchor="middle" font-size="11.5" fill="#17201f">información</text>
        <text x="780" y="190" text-anchor="middle" font-size="11.5" fill="#17201f">personas / artefactos</text>
        <text x="680" y="196" text-anchor="middle" font-size="12" fill="#33403e">mira también la red</text>

    <div class="callout">Esto no significa que “Internet piense por nosotros”. Significa algo más matizado: <strong>ciertas capacidades funcionales dependen de la organización entre recursos internos y externos</strong>.</div>
  `
},

/* ---------------- 05 ---------------- */
{type:'section', section:'05 · Memoria', num:'05', title:'Conectivismo y memoria', sub:'Recordar X frente a recordar cómo acceder a X'},

{
  type:'content', section:'05 · Memoria', nav:'Recordar X vs recordar dónde',
  title:'Recordar X frente a recordar cómo acceder a X',
  body:`
    <div class="mem-cols" style="margin:14px 0 16px">
      <div class="mem-col">
        <h6>Recordar X</h6>
        <p>El contenido exacto: un concepto, una fecha, una definición.</p>
      </div>
      <div class="mem-col" style="background:var(--accent-soft);border-color:var(--accent)">
        <h6>Recordar cómo acceder a X</h6>
        <p>Quién lo escribió, dónde encontrarlo, con qué otra teoría se relaciona, por qué es relevante, cuándo debería consultarlo.</p>
      </div>
    </div>
    <p class="muted-note">Una persona puede olvidar el contenido exacto de un artículo y, sin embargo, recordar quién lo escribió, dónde encontrarlo, con qué otra teoría se relaciona, por qué es relevante y cuándo debería consultarlo.</p>
  `
},

{
  type:'content', section:'05 · Memoria', nav:'Simulación: memoria híbrida',
  title:'Simulación: memoria híbrida',
  body:`
    <div class="sim" id="sim-mem">
      <div class="sim__head">Simulación · ¿Qué recuerda la persona?</div>
      <div class="sim__modes">
        <button class="sim__btn is-on" data-mem="interna">Recordar el contenido exacto</button>
        <button class="sim__btn" data-mem="distribuida">Recordar dónde y cómo acceder</button>
        <button class="sim__btn" data-mem="hibrida">Ambas cosas</button>
      </div>
      <div class="sim__stage" id="memStage"></div>
      <p class="sim__out" id="memOut"></p>
    </div>
    <div class="everyday">Ejemplo cotidiano: puedes no recordar el número de teléfono de tu madre porque lo tienes en favoritos, pero sí recuerdas que está ahí, cómo buscarlo y cuándo usarlo. La pregunta interesante es qué tipo de memoria se está ejercitando.</div>
  `
},

{
  type:'content', section:'05 · Memoria', nav:'La memoria interna sigue importando',
  title:'La memoria interna sigue importando',
  body:`
    <p class="lead">En términos educativos, esto no convierte la memoria interna en innecesaria.</p>
    <div class="callout">Necesitamos conocimientos previos para reconocer si aquello que recuperamos es razonable.</div>
    <p class="muted-note">Y esta tensión será crucial cuando entremos en IA.</p>
  `
},

/* ---------------- 06 ---------------- */
{type:'section', section:'06 · Google no piensa por mí', num:'06', title:'Conectivismo no significa “Google lo sabe por mí”', sub:'Una primera crítica necesaria'},

{
  type:'content', section:'06 · Google no piensa por mí', nav:'La tentación',
  title:'La tentación',
  body:`
    <p>Si llevamos la idea de conocimiento distribuido al extremo, podríamos concluir:</p>
    <div class="callout callout--no">“No necesito aprender nada. Solo necesito saber buscarlo”.</div>
    <p>Psicológicamente esto es problemático.</p>
  `
},

{
  type:'content', section:'06 · Google no piensa por mí', nav:'Por qué es problemático',
  title:'Por qué es problemático',
  body:`
    <ul class="clean">
      <li>Para formular una buena búsqueda necesito algún conocimiento.</li>
      <li>Para determinar si un resultado es correcto necesito conocimiento.</li>
      <li>Para establecer relaciones entre dos fuentes necesito conocimiento.</li>
      <li>Para identificar una contradicción necesito conocimiento.</li>
    </ul>
    <div class="quote-big">Conocimiento interno y conexiones externas no son sustitutos absolutos. Son recursos que se vuelven interdependientes.</div>
    <p class="muted-note">Una red muy grande no hace competente a quien carece de criterios para navegarla.</p>
  `
},

{
  type:'content', section:'06 · Google no piensa por mí', nav:'Ejemplo cotidiano',
  title:'Ejemplo cotidiano',
  body:`
    <div class="everyday">Si te duele la cabeza y buscas en internet, necesitas saber qué síntomas mencionar, qué preguntas hacer, qué resultados descartar y cuándo consultar a un profesional. El buscador no piensa por ti: amplifica lo que ya sabes o lo que no sabes.</div>
    <p class="muted-note">Ocurre lo mismo cuando buscas bibliografía sobre apego, cuando pides a una IA que te explique un concepto o cuando consultas a un colega. La red solo es tan buena como los criterios de quien la recorre.</p>
  `
},

/* ---------------- 07 ---------------- */
{type:'section', section:'07 · Llega la IA', num:'07', title:'Entonces llega la IA generativa', sub:'El nodo tecnológico cambia de naturaleza'},

{
  type:'content', section:'07 · Llega la IA', nav:'Buscador vs IA generativa',
  title:'Buscador vs IA generativa',
  body:`
    <div class="cols">
      <div class="card">
        <h4>Buscador tradicional</h4>
        <p>Nos conecta fundamentalmente con documentos.</p>
      </div>
      <div class="card card--accent">
        <h4>IA generativa</h4>
        <p>Permite interactuar con un sistema que:</p>
        <ul class="clean compact" style="margin-top:8px">
          <li>produce respuestas;</li>
          <li>reorganiza información;</li>
          <li>sintetiza y compara;</li>
          <li>clasifica y transforma formatos;</li>
          <li>genera hipótesis;</li>
          <li>responde iterativamente a nuevas instrucciones.</li>
        </ul>
      </div>
    </div>
    <p class="muted-note">Eso modifica la naturaleza del “nodo tecnológico”.</p>
  `
},

{
  type:'content', section:'07 · Llega la IA', nav:'Evolución del nodo tecnológico',
  title:'Evolución del nodo tecnológico',
  body:`
    <div class="ladder">
      <div class="ladder__step"><b>Libro</b>almacena</div>
      <div class="ladder__step"><b>Buscador</b>localiza</div>
      <div class="ladder__step"><b>Red social / comunidad</b>conecta personas e información</div>
      <div class="ladder__step ladder__step--accent"><b>IA generativa</b>interactúa + reorganiza + genera</div>
    </div>
    <p class="muted-note">Esto no implica que la IA “sepa” en el mismo sentido psicológico que una persona. Significa que ocupa una posición funcional mucho más activa dentro de la red cognitiva del estudiante.</p>
  `
},

/* ---------------- 08 ---------------- */
{type:'section', section:'08 · Conectivismo aumentado', num:'08', title:'Del conectivismo digital al conectivismo aumentado por IA', sub:'El eje central de la clase'},

      </defs>
      <line x1="360" y1="210" x2="360" y2="90" stroke="#1f5c5b" stroke-width="1.5" marker-start="url(#a3)" marker-end="url(#a3)"/>

      <rect x="280" y="46" width="160" height="44" rx="22" fill="#ffffff" stroke="#1f5c5b" stroke-width="1.4"/>
      <text x="360" y="74" text-anchor="middle" font-size="13.5" font-weight="650" fill="#17201f">OTRAS PERSONAS</text>

  `
},

{
  type:'content', section:'09 · Del acceso al juicio', nav:'Los cinco procesos metacognitivos',
  title:'Los cinco procesos metacognitivos',
  body:`
    <div class="v-grid">
      <div class="v-grid__item"><span>1</span><b>Planificación.</b> ¿Qué necesito conocer?</div>
      <div class="v-grid__item"><span>2</span><b>Selección.</b> ¿A qué recurso recurro?</div>
      <div class="v-grid__item"><span>3</span><b>Monitoreo.</b> ¿Estoy comprendiendo la respuesta?</div>
      <div class="v-grid__item"><span>4</span><b>Evaluación.</b> ¿Es correcta, relevante y suficientemente sustentada?</div>
      <div class="v-grid__item"><span>5</span><b>Regulación.</b> ¿Debo cambiar de estrategia, fuente o pregunta?</div>
    </div>
    <div class="quote-big">Una red de aprendizaje es tan valiosa como la capacidad metacognitiva del aprendiz para regularla.</div>
  `
},

/* ---------------- 10 ---------------- */
{type:'section', section:'10 · Conexión ≠ conocimiento', num:'10', title:'La conexión no garantiza conocimiento', sub:'Cantidad, calidad y competencia de navegación'},

{
  type:'content', section:'10 · Conexión ≠ conocimiento', nav:'Vulnerabilidad vs red potente',
  title:'Vulnerabilidad epistemológica vs red potente',
  body:`
    <div class="cols">
      <div class="card">
        <h4>Muchas conexiones + pocos criterios</h4>
        <p>= vulnerabilidad epistemológica.</p>
      </div>
      <div class="card card--accent">
        <h4>Conexiones pertinentes + criterios sólidos</h4>
        <p>= red potente de aprendizaje.</p>
      </div>
    </div>
    <p>Una red puede contener: información correcta, información obsoleta, información falsa, propaganda, sesgos, resultados irrelevantes, fuentes incompatibles y contenido generado artificialmente.</p>
    <div class="callout">El desafío psicológico ya no consiste exclusivamente en conectar. Consiste en aprender <strong>qué conectar + con qué + para qué + bajo qué criterios + cuándo desconectar</strong>.</div>
  `
},

{
  type:'content', section:'10 · Conexión ≠ conocimiento', nav:'Tres dimensiones',
  title:'Tres dimensiones',
  body:`
    <div class="v-three">
      <div class="v-three__item">
        <span class="v-three__num">1</span>
        <h4>Cantidad de conexiones</h4>
        <p>¿Cuántos nodos puedo consultar?</p>
      </div>
      <div class="v-three__item">
        <span class="v-three__num">2</span>
        <h4>Calidad de conexiones</h4>
        <p>¿Son relevantes y confiables?</p>
      </div>
      <div class="v-three__item v-three__item--accent">
        <span class="v-three__num">3</span>
        <h4>Competencia de navegación</h4>
        <p>¿Sé cuándo, cómo y por qué utilizarlos? Esta tercera dimensión es especialmente psicológica.</p>
      </div>
    </div>
    <p class="muted-note">Siemens ya concedía especial importancia a la capacidad para establecer conexiones, distinguir información importante de la que no lo es y mantener actualizado el conocimiento.</p>
  `
},

/* ---------------- 11 ---------------- */
{type:'section', section:'11 · Psicología del juicio', num:'11', title:'Aquí aparece la Psicología del juicio', sub:'La paradoja del experto y la del principiante'},

{
  type:'content', section:'11 · Psicología del juicio', nav:'La pregunta a la IA',
  title:'La pregunta a la IA',
  body:`
    <p>Pensemos en una estudiante preguntando a una IA:</p>
    <div class="quote-big">“¿Qué tratamiento es más efectivo para el trastorno X?”</div>
    <p>La IA puede devolver una respuesta excelente, mediocre o parcialmente incorrecta.</p>

{
  type:'content', section:'11 · Psicología del juicio', nav:'Ejemplo cotidiano',
  title:'Ejemplo cotidiano',
  body:`
    <div class="everyday">Un estudiante de primer semestre pide a la IA “explícame el DSM-5”. La IA responde con seguridad. El estudiante no puede detectar qué afirmaciones son correctas, cuáles son simplificaciones y cuáles son directamente inventadas. Un clínico con formación puede hacerlo en minutos.</div>
    <p class="muted-note">La misma respuesta, el mismo sistema, dos niveles distintos de competencia para juzgarla. El problema no está en la IA: está en el desajuste entre la respuesta y los criterios de quien la recibe.</p>
  `
},

/* ---------------- 12 ---------------- */
{type:'section', section:'12 · Errores de la red', num:'12', title:'Las conexiones también pueden producir errores', sub:'Más conexiones no siempre es mejor cognición'},

{
  type:'content', section:'12 · Errores de la red', nav:'Optimismo vs realidad',
  title:'Optimismo vs realidad',
  body:`
    <div class="cols">
      <div class="card">
        <h4>El conectivismo suele representarse de manera optimista</h4>
        <p>más conexiones → más aprendizaje.</p>
      </div>
      <div class="card card--accent">
        <h4>Pero psicológicamente</h4>
        <p>más conexiones ≠ necesariamente mejor cognición.</p>
      </div>
    </div>
    <p>Una red puede producir:</p>
    <ul class="clean two-col">
      <li>sobrecarga;</li>
      <li>fragmentación atencional;</li>
      <li>dependencia;</li>
      <li>cámaras de eco;</li>
      <li>automatización acrítica;</li>
      <li>falsa sensación de dominio.</li>
    </ul>
  `

/* ============================================================

const appEl      = document.getElementById('app');
const slidesEl   = document.getElementById('slides');
const indexEl    = document.getElementById('index');
const barEl      = document.getElementById('bar');
const sectionEl  = document.getElementById('ctrlSection');
const countEl    = document.getElementById('ctrlCount');
const prevBtn    = document.getElementById('prev');
const nextBtn    = document.getElementById('next');
const fsBtn      = document.getElementById('fs');
const toggleBtn  = document.getElementById('toggleIndex');
const sidebarEl  = document.getElementById('sidebar');
const scrimEl    = document.getElementById('scrim');

let current = 0;

slidesEl.innerHTML = SLIDES.map((s, i) => {
  const cls = ['slide'];
  if (s.type === 'section') cls.push('slide--section');
  if (s.type === 'cover')   cls.push('slide--cover');

  let inner;
  if (s.type === 'cover') {
    inner = `<div class="slide__inner cover">
      <div class="rule"></div>
      <div class="kicker">${s.kicker}</div>
      <h1>${s.title}</h1>
      ${s.body}
    </div>`;
  } else if (s.type === 'section') {
    inner = `<div class="slide__inner">
      <div class="sec-num">${s.num}</div>
      <h2>${s.title}</h2>
      <p class="sec-sub">${s.sub}</p>
    </div>`;
  } else {
    inner = `<div class="slide__inner">
      <div class="kicker">${s.section}</div>
      <h2>${s.title}</h2>
      ${s.body}
    </div>`;
  }

  return `<section class="${cls.join(' ')}" data-i="${i}" aria-hidden="${i === 0 ? 'false' : 'true'}">${inner}</section>`;
}).join('');

let idxHTML = `<button class="idx-home" data-i="0">Portada</button>`;
SLIDES.forEach((s, i) => {
  if (s.type === 'section') {
    idxHTML += `<button class="idx-section" data-i="${i}">${s.section}</button>`;
  } else if (s.type === 'content') {
    idxHTML += `<button class="idx-link" data-i="${i}">${s.nav || s.title}</button>`;
  }
});
indexEl.innerHTML = idxHTML;

/* --- gráfica de secciones --- */
(function buildChart(){
  const host = document.getElementById('chart');
  if (!host) return;
  const order = [];
  const counts = {};
  SLIDES.forEach(s => {
    if (!(s.section in counts)) { counts[s.section] = 0; order.push(s.section); }
    counts[s.section]++;
  });
  const max = Math.max(...order.map(k => counts[k]));
  host.innerHTML = order.map(k => `
    <div class="chart__row">
      <span class="chart__label">${k}</span>
      <div class="chart__track"><div class="chart__fill" style="--w:${Math.round((counts[k] / max) * 100)}%"></div></div>
      <span class="chart__value">${counts[k]}</span>
    </div>`).join('');
})();

const slideNodes = Array.from(slidesEl.querySelectorAll('.slide'));
const navNodes   = Array.from(indexEl.querySelectorAll('[data-i]'));

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function goTo(i) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  current = i;

  slideNodes.forEach((n, k) => {
    const on = (k === i);
    n.classList.toggle('is-active', on);
    n.setAttribute('aria-hidden', on ? 'false' : 'true');
    if (on) n.scrollTop = 0;
  });

  navNodes.forEach(n => {
    const on = (+n.dataset.i === i);
    n.classList.toggle('is-active', on);
    if (on) n.setAttribute('aria-current', 'true');
    else n.removeAttribute('aria-current');
  });

  const s = SLIDES[i];
  sectionEl.textContent = s.section;
  countEl.textContent = `${String(i + 1).padStart(2, '0')} / ${SLIDES.length}`;
  barEl.style.width = `${((i + 1) / SLIDES.length) * 100}%`;

  prevBtn.disabled = (i === 0);
  nextBtn.disabled = (i === SLIDES.length - 1);

  const animEls = slideNodes[i].querySelectorAll(
    '.card, .step, .flow__item, ul.clean li, ol.num li, .chip, .table-wrap, .callout, .eq, .chart__row, .pipe-node, .v-three__item, .v-grid__item, .v-group, .sim, .bignum, .ladder__step, .quote-big, .everyday, .stu-card, .node-pill'
  );
  animEls.forEach((el, k) => {
    el.style.animationDelay = Math.min(k * 32, 460) + 'ms';
  });

  try { history.replaceState(null, '', `#slide-${i + 1}`); } catch (e) {}

  const active = indexEl.querySelector('.is-active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

(function initFromHash() {
  const m = location.hash.match(/slide-(\d+)/);
  const start = m
    ? Math.min(SLIDES.length - 1, Math.max(0, parseInt(m[1], 10) - 1))
    : 0;
  goTo(start);
})();

nextBtn.addEventListener('click', () => goTo(current + 1));
prevBtn.addEventListener('click', () => goTo(current - 1));

indexEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-i]');
  if (!b) return;
  goTo(+b.dataset.i);
  closeMenu();
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ':
      e.preventDefault(); goTo(current + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
      e.preventDefault(); goTo(current - 1); break;
    case 'Home': e.preventDefault(); goTo(0); break;
    case 'End': e.preventDefault(); goTo(SLIDES.length - 1); break;
    case 'Escape': closeMenu(); break;
  }
});

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
  } else {
    (document.exitFullscreen || function(){}).call(document);
  }
});

const ICON_SHOW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9.5 4v16"/></svg>`;
const ICON_HIDE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9.5 4v16"/><path d="M14.5 12h4"/></svg>`;

let indexHidden = false;

function toggleIndex() {
  if (window.innerWidth <= 980) {
    if (sidebarEl.classList.contains('is-open')) closeMenu();
    else openMenu();
    return;
  }
  indexHidden = !indexHidden;
  appEl.classList.toggle('app--collapsed', indexHidden);
  toggleBtn.setAttribute('aria-expanded', String(!indexHidden));
  toggleBtn.innerHTML = indexHidden ? ICON_SHOW : ICON_HIDE;
}

toggleBtn.addEventListener('click', toggleIndex);

function openMenu() {
  sidebarEl.classList.add('is-open');
  scrimEl.classList.add('is-open');
  toggleBtn.setAttribute('aria-expanded', 'true');
}
function closeMenu() {
  sidebarEl.classList.remove('is-open');
  scrimEl.classList.remove('is-open');
  if (window.innerWidth <= 980) toggleBtn.setAttribute('aria-expanded', 'false');
}
scrimEl.addEventListener('click', closeMenu);

window.addEventListener('resize', () => {
  if (window.innerWidth > 980) {
    sidebarEl.classList.remove('is-open');
    scrimEl.classList.remove('is-open');
  }
});

window.addEventListener('hashchange', () => {
  const m = location.hash.match(/slide-(\d+)/);
  if (!m) return;
  const i = Math.min(SLIDES.length - 1, Math.max(0, parseInt(m[1], 10) - 1));
  if (i !== current) goTo(i);
});
