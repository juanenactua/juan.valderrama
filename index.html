<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Juan Carlos Valderrama Cardenas | Biblioteca Digital
  </title>

  <meta
    name="description"
    content="Biblioteca digital de Juan Carlos Valderrama Cardenas. Recursos educativos, materiales interactivos y contenidos para la docencia y la investigación."
  >


  <style>

    /* =========================================================
       CONFIGURACIÓN GENERAL
       ========================================================= */

    :root {

      --fondo: #050505;
      --texto: #f5f5f5;
      --secundario: #a1a1aa;
      --tenue: #71717a;
      --borde: #27272a;
      --borde-activo: #52525b;

    }


    * {

      margin: 0;
      padding: 0;
      box-sizing: border-box;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      min-height: 100vh;

      background: var(--fondo);
      color: var(--texto);

      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;

    }


    a {

      color: inherit;
      text-decoration: none;

    }


    button,
    input {

      font: inherit;

    }


    /* =========================================================
       CONTENEDOR
       ========================================================= */

    .contenedor {

      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;

    }


    /* =========================================================
       CABECERA
       ========================================================= */

    header {

      display: flex;
      justify-content: space-between;
      align-items: center;

      min-height: 76px;

      border-bottom: 1px solid var(--borde);

    }


    .biblioteca {

      font-size: 14px;
      color: var(--secundario);
      letter-spacing: 0.02em;

    }


    .biblioteca::before {

      content: "▣";
      color: white;
      margin-right: 10px;

    }


    .area {

      text-transform: uppercase;

      font-size: 11px;

      letter-spacing: 0.2em;

      color: #52525b;

    }


    /* =========================================================
       PRESENTACIÓN
       ========================================================= */

    .hero {

      min-height: 520px;

      display: grid;

      grid-template-columns:
        1.15fr
        0.85fr;

      align-items: center;

      gap: 80px;

      padding: 90px 0;

    }


    .etiqueta-superior {

      margin-bottom: 22px;

      color: var(--tenue);

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.25em;

    }


    h1 {
