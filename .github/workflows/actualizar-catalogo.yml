name: Actualizar catalogo

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "materiales/**"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar catalogo
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser

          carpeta = Path("materiales")
          materiales = []


          class LectorMetadatos(HTMLParser):

              def __init__(self):
                  super().__init__()
                  self.metadatos = {}

              def handle_starttag(self, tag, attrs):

                  if tag.lower() != "meta":
                      return

                  atributos = dict(attrs)

                  nombre = atributos.get("name", "")
                  contenido = atributos.get("content", "")

                  if nombre.startswith("jc-"):
                      self.metadatos[nombre] = contenido.strip()


          def leer_metadatos(archivo):

              contenido = archivo.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              parser = LectorMetadatos()
              parser.feed(contenido)

              return parser.metadatos


          for archivo in sorted(carpeta.glob("*.html")):

              meta = leer_metadatos(archivo)

              titulo = meta.get("jc-titulo", "")

              if not titulo:
                  print(
                      f"Ignorado: {archivo.name} "
                      "(no tiene jc-titulo)"
                  )
                  continue


              descripcion = meta.get(
                  "jc-descripcion",
                  ""
              )


              tipo = meta.get(
                  "jc-tipo",
                  "HTML"
              )


              etiquetas_texto = meta.get(
                  "jc-etiquetas",
                  ""
              )


              etiquetas = [
                  etiqueta.strip()
                  for etiqueta
                  in etiquetas_texto.split(",")
                  if etiqueta.strip()
              ]


              curso = meta.get(
                  "jc-curso",
                  ""
              )


              autor = meta.get(
                  "jc-autor",
                  ""
              )


              material = {

                  "titulo": titulo,

                  "descripcion": descripcion,

                  "tipo": tipo,

                  "archivo": archivo.as_posix(),

                  "etiquetas": etiquetas

              }


              if curso:

                  material["curso"] = curso


              if autor:

                  material["autor"] = autor


              materiales.append(material)

              print(
                  f"Agregado: {titulo}"
              )


          materiales.sort(
              key=lambda material:
                  material["titulo"].casefold()
          )


          with open(
              "catalogo.json",
              "w",
              encoding="utf-8"
          ) as salida:

              json.dump(
                  materiales,
                  salida,
                  ensure_ascii=False,
                  indent=2
              )

              salida.write("\n")


          print(
              f"Catalogo generado correctamente: "
              f"{len(materiales)} materiales"
          )

          PY


      - name: Mostrar catalogo generado
        run: |
          cat catalogo.json


      - name: Guardar catalogo actualizado
        run: |

          if git diff --quiet catalogo.json; then

            echo "El catalogo ya esta actualizado."

            exit 0

          fi


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add catalogo.json


          git commit -m "Actualizar catalogo automaticamente"


          git push
